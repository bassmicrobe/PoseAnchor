name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows x64 (MSVC, driver + tests)
    # windows-latest now provides VS 2026, but our preset targets VS 2022.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure
        run: cmake --preset vs2022-x64

      - name: Build (Release)
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Benchmark smoke run
        # Correctness only (exit code checks state/diagnostics); timings on shared
        # CI runners are not meaningful and are not asserted.
        run: .\build\Release\pose_anchor_benchmark.exe

      - name: Driver hot-path benchmark smoke run
        run: .\build\Release\pose_anchor_device_registry_benchmark.exe

      - name: Verify configuration switching does not mix package binaries
        run: .\tests\package_staging_tests.ps1

      - name: Build unsigned installer and checksum
        run: .\scripts\build-installer.ps1 -SkipBuild

  linux-sanitizers:
    name: Core filter (clang, ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure
        run: >
          cmake -B build-sanitize -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DPOSE_ANCHOR_BUILD_DRIVER=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"

      - name: Build
        run: cmake --build build-sanitize

      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure
        env:
          ASAN_OPTIONS: strict_string_checks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
